apps:
  - name: pixelgraphics-example
    context:
      - ulanzi-tc001
      - waveshare-esp32-s3-matrix
      - native
    # env:
    #   global:
    #     RUSTFLAGS:
    #     - --cfg place_rmt_driver_in_ram
    selects:
      - smartled-config
      #      - sw/threading
      #- network
      - random
      - ?release
      - coap-server
      # impossible due to https://github.com/ariel-os/ariel-os/pull/1786
      #- coap-server-config-storage
      - coap-server-config-demokeys

modules:
  - name: smartled-esp32
    provides_unique: [smartled-config]
    context:
      - esp32
    env:
      global:
        FEATURES:
          - esp-hal
          - esp-hal-smartled/esp32
  - name: smartled-esp32s3
    provides_unique: [smartled-config]
    context:
      - esp32s3
    env:
      global:
        FEATURES:
          - esp-hal
          - esp-hal-smartled/esp32s3
  - name: smartled-native
    help: |
      Has no LED output at all, but is helpful for developing a CoAP peer.

      Practically, this works well enough without actual LEDs:
      a (separate) CoAP client can just poll the framebuffer and show that from a separate process.
    provides_unique: [smartled-config]
    context:
      - native
